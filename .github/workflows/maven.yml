name: Java CI/CD Pipeline 

on:

 push:
  branches:["main"]
 pull_request:
  branches:["main"]
 workflow_dispatch:

jobs:
  build:
   runs-on: windows-latest

   steps:
    - name:Checkout repository
      uses: actions/checkout@v4

    -name: set up JDK 21
     uses: actions/setup-java@v4

      with:
       java-version: '21'
       distribution:'temurin'

    -name: compile Java program
     run: javac New.java

    -name: Run Java program
     run: java New